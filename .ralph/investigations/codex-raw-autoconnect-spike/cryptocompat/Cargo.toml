[package]
name = "cryptocompat"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "cryptocompat"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
crypto_box = { version = "0.9", features = ["std"] }
xsalsa20poly1305 = "0.9"
aes-gcm = "0.10"
ed25519-dalek = "2"
hex = "0.4"

