name: Toolkit submodule invariant

on:
    pull_request:
        paths:
            - '.gitmodules'
            - 'AGENTS.md'
            - 'ai-developer-toolkit'
            - 'tools/check-toolkit-submodule-invariants.mjs'
            - 'package.json'
            - '.github/workflows/toolkit-submodule-invariant.yml'
    push:
        branches:
            - main
        paths:
            - '.gitmodules'
            - 'AGENTS.md'
            - 'ai-developer-toolkit'
            - 'tools/check-toolkit-submodule-invariants.mjs'
            - 'package.json'
            - '.github/workflows/toolkit-submodule-invariant.yml'

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  submodules: false

            - name: Install pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check toolkit submodule invariant
              run: pnpm check:toolkit-submodule
